# Free Supabase projects pause after a week without activity. This pings the sync function
# every three days so the project stays awake even during exams or a holiday.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 21 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call rtf_get with a dummy key
        run: |
          URL=$(sed -n 's/.*supabaseUrl: *"\([^"]*\)".*/\1/p' config.js)
          KEY=$(sed -n 's/.*supabaseKey: *"\([^"]*\)".*/\1/p' config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Sync not configured, nothing to do"; exit 0; fi
          curl -sf -X POST "$URL/rest/v1/rpc/rtf_get" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_key":"keepalive-keepalive-keepalive-00"}' && echo " ok"
